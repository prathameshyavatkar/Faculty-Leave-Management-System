{% extends "base.html" %}
{% block page_title %}My Leaves{% endblock %}
{% block content %}
<h2>My Leaves</h2>
<div class="card">
    <table>
        <tr><th>From</th><th>To</th><th>Type</th><th>Status</th></tr>
        {% for l in leaves %}
        <tr>
            <td>{{ l.from_date }}</td>
            <td>{{ l.to_date }}</td>
            <td>{{ l.leave_type }}</td>
            <td><span class="badge badge-{{ l.status|lower }}">{{ l.status }}</span></td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="muted">No leave requests yet.</td></tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
