{% extends "base.html" %}
{% block page_title %}Faculty Management{% endblock %}
{% block content %}
<h2>Faculty Management</h2>
<div class="card">
    <table>
        <tr><th>ID</th><th>Name</th><th>Department</th><th>Subject</th><th>Leave Balance</th></tr>
        {% for f in faculty %}
        <tr>
            <td>{{ f.id }}</td><td>{{ f.name }}</td><td>{{ f.department }}</td>
            <td>{{ f.subject }}</td><td>{{ f.leave_balance }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
